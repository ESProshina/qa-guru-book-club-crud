plugins {
    id 'java'
    id 'io.qameta.allure' version '3.0.0'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

def allureVersion = '2.25.0'
def aspectjVersion = '1.9.22'

allure {
    report {
        version.set(allureVersion)
    }
    adapter {
        aspectjWeaver.set(true)
        frameworks {
            junit5 {
                adapterVersion.set(allureVersion)
            }
        }
    }
}

dependencies {


    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'io.rest-assured:json-schema-validator:5.4.0'
    testImplementation 'io.rest-assured:rest-assured:5.4.0'
    testImplementation 'org.assertj:assertj-core:3.25.3'

    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'
    testImplementation "io.qameta.allure:allure-rest-assured:$allureVersion"
    testImplementation "io.qameta.allure:allure-junit5:$allureVersion"
    testImplementation "org.aspectj:aspectjweaver:$aspectjVersion"

    testImplementation 'net.datafaker:datafaker:2.1.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'
}

test {
    useJUnitPlatform()
    systemProperty "allure.results.directory", "build/allure-results"

    doFirst {
        def aspectjWeaver = configurations.testRuntimeClasspath.find {
            it.name.contains('aspectjweaver')
        }
        if (aspectjWeaver != null) {
            jvmArgs "-javaagent:${aspectjWeaver.absolutePath}"
        }
    }
}